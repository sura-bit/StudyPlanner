spring.application.name=StudyPlanner

# Database: the password (and, for Docker, the URL) come from the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studyplanner}
spring.datasource.username=${DB_USERNAME:plannerapp}
spring.datasource.password=${DB_PASSWORD:plannerapp1234}

# reset.sql creates the tables; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: set JWT_SECRET (at least 32 bytes) outside the project. The default is for class only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=30

# Pages allowed to call the API from a browser (the Next.js client runs on port 3000).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}