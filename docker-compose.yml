services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: studyplanner
      MYSQL_USER: plannerapp
      MYSQL_PASSWORD: plannerapp1234
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      # Creates tables and sample data the first time the volume is empty
      - ./reset.sql:/docker-entrypoint-initdb.d/01-reset.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/studyplanner?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: plannerapp
      DB_PASSWORD: plannerapp1234
      JWT_SECRET: docker-dev-secret-change-me-0123456789ab
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
